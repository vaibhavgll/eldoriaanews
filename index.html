<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Eldoriaaa | Server Intelligence</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Rajdhani:wght@500;600;700&family=VT323&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* [KEEPING YOUR EXACT CSS - NO CHANGES TO UI] */
        :root {
            --primary: #00ff88;
            --primary-dim: rgba(0, 255, 136, 0.1);
            --secondary: #bd00ff;
            --bg-dark: #050505;
            --glass: rgba(20, 20, 20, 0.85);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-main: #ffffff;
            --text-muted: #888888;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            background-color: var(--bg-dark); color: var(--text-main); font-family: 'Inter', sans-serif;
            overflow-x: hidden; background-image: radial-gradient(circle at 50% 50%, rgba(0, 255, 136, 0.05), transparent 60%);
            padding-bottom: 80px;
        }
        .glass-panel { background: var(--glass); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid var(--glass-border); border-radius: 12px; }
        .btn-neon {
            background: transparent; border: 1px solid var(--primary); color: var(--primary); padding: 8px 16px;
            font-family: 'Rajdhani', sans-serif; font-weight: 700; text-transform: uppercase; cursor: pointer; transition: 0.3s; font-size: 0.9rem;
        }
        .btn-neon:hover { background: var(--primary); color: #000; }
        nav {
            position: fixed; top: 0; width: 100%; z-index: 100; background: rgba(5, 5, 5, 0.95);
            border-bottom: 1px solid var(--glass-border); padding: 15px 20px; display: flex; justify-content: space-between; align-items: center;
        }
        .logo { font-size: 1.5rem; font-family: 'Rajdhani'; font-weight: 800; color: white; }
        .logo span { color: var(--primary); }
        .hero { margin-top: 60px; padding: 60px 20px; text-align: center; }
        .hero h1 { font-family: 'Rajdhani'; font-size: 3.5rem; line-height: 0.9; margin-bottom: 20px; text-transform: uppercase; }
        .server-status {
            display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 50px;
            background: var(--primary-dim); border: 1px solid var(--primary); margin-bottom: 20px; font-size: 0.8rem; font-weight: bold; color: var(--primary);
        }
        .status-dot { width: 8px; height: 8px; background: var(--primary); border-radius: 50%; box-shadow: 0 0 8px var(--primary); }
        .ip-card {
            background: #111; border: 1px solid var(--glass-border); padding: 15px; border-radius: 8px;
            display: inline-flex; align-items: center; gap: 10px; cursor: pointer; margin-top: 20px; max-width: 100%;
        }
        .ip-text { font-family: 'VT323'; font-size: 1.2rem; }
        .section-title { font-family: 'Rajdhani'; font-size: 1.5rem; color: var(--primary); margin-bottom: 20px; display: flex; align-items: center; gap: 10px; margin-top: 50px;}
        .section-title.shop { color: var(--secondary); }
        .section-title::after { content: ''; flex: 1; height: 1px; background: var(--glass-border); }
        .container { max-width: 1100px; margin: 0 auto; padding: 0 20px; display: grid; grid-template-columns: 2.5fr 1fr; gap: 30px; }
        
        /* CARD STYLES */
        .news-card { margin-bottom: 30px; overflow: hidden; transition: 0.3s; }
        .news-card:hover { transform: translateY(-5px); border-color: var(--primary); }
        .card-img { width: 100%; height: 200px; object-fit: cover; }
        .card-body { padding: 20px; }
        .card-title { font-family: 'Rajdhani'; font-size: 1.4rem; margin-bottom: 10px; line-height: 1.2; }
        .card-meta { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 15px; display: flex; justify-content: space-between; }
        
        .empty-msg { padding: 20px; border: 1px dashed #333; color: #666; text-align: center; border-radius: 10px; }

        @media (max-width: 768px) {
            .container { grid-template-columns: 1fr; }
            .hero h1 { font-size: 2.5rem; }
            .ip-card { width: 100%; justify-content: space-between; }
        }
    </style>
</head>
<body>

    <nav>
        <div class="logo">ELDORIAAA<span>.</span></div>
        <a href="admin.html" class="btn-neon" style="text-decoration:none; font-size:0.7rem;">ADMIN</a>
    </nav>

    <section class="hero">
        <div class="server-status">
            <span class="status-dot"></span> <span id="player-count">...</span> ONLINE
        </div>
        <h1>ELDORIAA<br><span style="color:var(--text-muted); font-size: 0.4em; letter-spacing: 2px;">OFFICIAL HUB</span></h1>
        
        <div class="ip-card" onclick="copyIP()">
            <i class="fas fa-wifi" style="color:var(--secondary)"></i>
            <span class="ip-text">eldoriaaa.aternos.me:30820</span>
            <i class="far fa-copy"></i>
        </div>
    </section>

    <div class="container">
        <main>
            <div class="section-title"><i class="fas fa-newspaper"></i> DAILY BLOCK NEWS</div>
            <div id="block-news-container">
                <div class="empty-msg">Loading News Data...</div> 
            </div>

            <div class="section-title shop"><i class="fas fa-shopping-cart"></i> SHOP NEWS</div>
            <div id="shop-news-container">
                <div class="empty-msg">Loading Shop Data...</div>
            </div>
        </main>

        <aside>
            <div class="glass-panel" style="padding:20px;">
                <h4 style="font-family:'Rajdhani'; margin-bottom:15px; color:var(--primary);">COMMUNITY</h4>
                <a href="#" class="btn-neon" style="display:block; text-align:center; text-decoration:none;">JOIN DISCORD</a>
            </div>
        </aside>
    </div>

    <script src="database.js"></script>

    <script>
        // 1. RENDER NEWS FROM DATABASE.JS
        function renderNews() {
            const blockContainer = document.getElementById('block-news-container');
            const shopContainer = document.getElementById('shop-news-container');
            
            // Clear Loading Msg
            blockContainer.innerHTML = '';
            shopContainer.innerHTML = '';

            // Get Data (from database.js)
            const db = window.eldoriaDB || [];

            // Filter Data
            const blockNews = db.filter(item => item.type === 'block');
            const shopNews = db.filter(item => item.type === 'shop');

            // Render Function
            const createCard = (item) => `
                <article class="glass-panel news-card">
                    <img src="${item.image}" class="card-img">
                    <div class="card-body">
                        <div class="card-meta"><span>${item.date}</span> <span>${item.author}</span></div>
                        <h3 class="card-title">${item.title}</h3>
                        <a href="${item.link}" class="btn-neon" style="display:inline-block; text-decoration:none; margin-top:10px;">READ FULL</a>
                    </div>
                </article>
            `;

            // Logic: Block News
            if(blockNews.length > 0) {
                blockNews.forEach(item => blockContainer.innerHTML += createCard(item));
            } else {
                blockContainer.innerHTML = '<div class="empty-msg">None</div>';
            }

            // Logic: Shop News
            if(shopNews.length > 0) {
                shopNews.forEach(item => shopContainer.innerHTML += createCard(item));
            } else {
                shopContainer.innerHTML = '<div class="empty-msg">None</div>';
            }
        }

        // 2. SERVER UTILS
        function copyIP() {
            navigator.clipboard.writeText("eldoriaaa.aternos.me:30820");
            alert("IP Copied!");
        }

        fetch('https://api.mcstatus.io/v2/status/java/eldoriaaa.aternos.me:30820')
            .then(r => r.json())
            .then(data => {
                const count = document.getElementById('player-count');
                if(data.online) count.innerText = data.players.online + " PLAYERS";
                else count.innerText = "OFFLINE";
            });

        // Initialize
        window.onload = renderNews;
    </script>
</body>
</html>
